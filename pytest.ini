[pytest]
testpaths = tests
addopts = -ra
markers =
    windows: requires Windows-specific APIs or packages
    gui: requires Qt or a display; run with QT_QPA_PLATFORM=offscreen
    audio: requires an audio device or audio backend
    live2d: requires the native Live2D runtime or model assets
    network: requires network access
    slow: takes noticeably longer than the normal suite
