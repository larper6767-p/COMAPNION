# ── Feature 12: Real SFX audio ───────────────────────────────────────────────
# Feature 7 sound scripts put symbols (~ ♥ ♡ ♪) and onomatopoeia ("haahh~",
# "mwah") into her speech.  This feature turns them into REAL audio.
#
# Feature 12c (splice: true) — the default: the word/symbol is REMOVED from
# the text TTS speaks and its clip plays at that exact spot, so "mwah" is
# never read aloud as a word.  With splice: false the old behaviour remains:
# the clip plays when the sentence starts and the word is spoken normally.
#
# CLIPS: assets/sfx holds clips generated by tools/gen_sfx.py (her voice:
# heart / tender / giggle) and tools/gen_sfx_foley.py (procedural foley:
# kiss / breath / suck / gasp).  Naming: <stem><digits>.<ext>
#     e.g.  breath_1.wav   breath2.ogg   heart_01.mp3
# Drop your own recordings in with the same names to replace them.
#
# No clips (or a missing folder) = no cues are spliced and she speaks
# exactly as before.  Set enabled: false to turn it off entirely.
# The file hot-reloads on change, except the clip folder list (add clips and
# restart once).

enabled: true

folder: assets/sfx

volume: 0.5      # 0.0 .. 1.0 (applied to the clip, TTS volume is separate)
cooldown: 2.0    # seconds between two plays of the SAME category
gap: 0.4         # minimum seconds between ANY two SFX (anti machine-gun)
max_per_sentence: 4

splice: false     # Feature 12c: strip the word from TTS, play its cue there
cue_beat_s: 0.25 # short beat after a spliced cue before the next words

# symbol/marker → candidate clip stems (random pick among them).
# The bubble ALWAYS keeps the text; with splice: true the word/symbol is
# removed only from the TTS copy and its cue plays at that spot.
triggers:
  "♥": [heart]   # deep pleasure / affection
  "♡": [tender]  # soft, tender warmth
  "♪": [giggle]  # playful, sing-song
  "~": [breath]  # blissful, elongated sound

# onomatopoeia the model may write (regex, case-insensitive) → stems.
# Feature 12d: the whole sound-script library is covered — each pattern is
# made of pure sound words so splicing it out never breaks the sentence.
words:
  "mwah|mmwah|smooch|\\bchu\\b": [kiss]
  "slurp|schlick|schlrp|glrk|glurk": [suck]
  "gasp|huff": [gasp]
  "\\bm{3,}h?\\b|\\bmmh+\\b|\\bm{2,}p+[fh]\\b": [moan]
  "\\bhn+ng+\\b|\\bnn+gh?\\b|\\bhnn+h\\b|\\bnn+h\\b": [whimper]
  "\\bsighs?\\b|\\bhaa+h+\\b|\\baa+h+\\b": [sigh]
  "\\b(?:a?ha){2,}h?\\b|\\b(?:he){2,}h?\\b|\\bteehee+\\b": [laugh]
  "\\bprrr+\\b|\\bmrrr+\\b|\\bmrrp+\\b": [purr]
  "\\bba[-\\s]?dum+\\b|\\bthump[-\\s]?thump\\b": [heartbeat]
  "\\bsniff+\\b|\\bsnff\\b": [sniff]
  "\\bgulp\\b|\\bglp+\\b": [gulp]
